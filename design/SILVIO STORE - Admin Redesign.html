<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>SILVIO STORE — Admin (refonte)</title>
<meta name="viewport" content="width=1440" />
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
        },
        colors: {
          brand: {
            50:  '#f5f7fa',
            100: '#e4e9f0',
            200: '#c8d2e0',
            300: '#9fb0c8',
            400: '#6f87aa',
            500: '#4d6890',
            600: '#3d557a',
            700: '#334562',
            800: '#2b3a52',
            900: '#1f2a3c',
            950: '#131b29',
          },
          accent: {
            DEFAULT: '#d97706',
            dark: '#b45309',
            soft: '#fef3c7',
            ink: '#78350f',
          },
        },
        boxShadow: {
          'card': '0 1px 2px rgba(15,23,42,0.04), 0 1px 4px rgba(15,23,42,0.04)',
          'lift': '0 8px 24px rgba(15,23,42,0.08)',
          'pop':  '0 12px 32px -8px rgba(31,42,60,0.18)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .font-display { font-family: 'Plus Jakarta Sans', Inter, sans-serif; letter-spacing: -0.01em; }
  /* dot indicator */
  .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  /* fake sparkline grid */
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(31,42,60,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(31,42,60,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  /* checkered placeholder */
  .ph-checker {
    background-image:
      linear-gradient(45deg, #eef2f7 25%, transparent 25%),
      linear-gradient(-45deg, #eef2f7 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eef2f7 75%),
      linear-gradient(-45deg, transparent 75%, #eef2f7 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    background-color: #f8fafc;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
</style>
</head>
<body class="bg-brand-50/50 text-brand-900">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" src="admin/data.jsx"></script>
<script type="text/babel" src="admin/shell.jsx"></script>
<script type="text/babel" src="admin/dashboard.jsx"></script>
<script type="text/babel" src="admin/products.jsx"></script>
<script type="text/babel" src="admin/orders.jsx"></script>
<script type="text/babel" src="admin/users.jsx"></script>
<script type="text/babel" src="admin/categories.jsx"></script>
<script type="text/babel" src="admin/settings.jsx"></script>
<script type="text/babel" src="admin/app.jsx"></script>
<script>
  // Re-init lucide on render
  setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 200);
</script>

</html>
